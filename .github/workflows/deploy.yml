name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore full lander + apply combo default + remove UI
        run: |
          # Restore the last known good full App.jsx
          curl -sL "https://raw.githubusercontent.com/quantumbusinessstrategies/xhumai/1b1973d0befa241c32ef5d9936b2509fbf6b46ff/frontend/src/App.jsx" -o frontend/src/App.jsx
          curl -sL "https://raw.githubusercontent.com/quantumbusinessstrategies/xhumai/1b1973d0befa241c32ef5d9936b2509fbf6b46ff/frontend/src/App.css" -o frontend/src/App.css

          # 1. Default to combo (the Replay setting)
          sed -i "s/useState('glitch') \/\/ 'glitch' | 'pixel' | 'combo'/useState('combo') \/\/ 'glitch' | 'pixel' | 'combo'/" frontend/src/App.jsx

          # 2. Completely remove the anim-controls UI block
          python3 -c '
import pathlib
p = pathlib.Path("frontend/src/App.jsx")
c = p.read_text()
start = c.find("      <div className=\"anim-controls\" aria-hidden>")
end = c.find("      <div className=\"canvas-wrap\" ref={mountRef} />")
if start != -1 and end != -1 and end > start:
    c = c[:start] + c[end:]
    p.write_text(c)
    print("Removed anim-controls block")
else:
    print("WARNING: controls block not found")
'

          # 3. Force-hide in CSS as safety net
          python3 -c '
import re, pathlib
p = pathlib.Path("frontend/src/App.css")
c = p.read_text()
c = re.sub(r"\.anim-controls\s*\{[^}]*\}", ".anim-controls {\n  display: none !important;\n}", c, count=1)
p.write_text(c)
print("CSS force-hide applied")
'

          # Verify
          grep -n "useState('combo')" frontend/src/App.jsx
          grep -c "anim-controls" frontend/src/App.jsx || echo "0 controls (good)"
          head -c 80 frontend/src/App.jsx
          echo ""
          wc -c frontend/src/App.jsx frontend/src/App.css

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
