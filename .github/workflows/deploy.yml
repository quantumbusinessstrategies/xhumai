name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore full lander App.jsx from parts
        run: |
          set -e
          node scripts/restore-app.mjs
          echo "=== Verify lander ==="
          wc -c frontend/src/App.jsx frontend/src/App.css
          grep -n "useState('combo')" frontend/src/App.jsx | head -1
          grep -n "ARM_COUNT\|SPIRAL\|playPixelForm" frontend/src/App.jsx | head -5
          test -s frontend/src/App.jsx
          test $(wc -c < frontend/src/App.jsx) -gt 50000

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Check dist
        run: |
          ls -la frontend/dist/
          find frontend/dist -type f -exec wc -c {} \; | sort -n | tail -10

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
